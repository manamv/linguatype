name: LinguaType CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. FRONTEND CI: TypeScript Check, 36 Vitest Client Tests & Production Bundle
  # ============================================================================
  frontend-ci:
    name: "Frontend: TypeScript, 36 Vitest Tests & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run 36 Client Unit, Integration & E2E Tests (Vitest + RTL)
        run: npx vitest run --reporter=verbose

      - name: Typecheck & Build Production Bundle
        run: npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguatype-frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # 2. BACKEND CI: .NET 10 ASP.NET Core Minimal API Build & Publish
  # ============================================================================
  backend-ci:
    name: "Backend: .NET 10 Minimal API Build & Publish"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore dependencies
        run: dotnet restore LinguaType.Api.csproj

      - name: Build & Publish Release API
        run: dotnet publish LinguaType.Api.csproj -c Release -o ./publish /p:UseAppHost=false

      - name: Upload Backend Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguatype-backend-publish
          path: backend/publish
          retention-days: 7

  # ============================================================================
  # 3. DOCKER INTEGRATION E2E & CD (GHCR Container Registry Publish)
  # ============================================================================
  docker-e2e-and-cd:
    name: "Docker Compose E2E Smoke & GHCR CD"
    runs-on: ubuntu-latest
    needs: [ frontend-ci, backend-ci ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Start Full Docker Compose Stack
        run: docker compose up -d --build

      - name: Live E2E Smoke Check (Frontend Nginx + Backend C# API)
        run: |
          echo "Waiting for LinguaType stack on http://localhost:8080..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null && curl -fsS http://localhost:8080/api/topics >/dev/null; then
              echo "✅ Frontend and Backend API are healthy!"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          TOPICS_COUNT=$(curl -fsS http://localhost:8080/api/topics | grep -o '"id"' | wc -l)
          echo "✅ Verified $TOPICS_COUNT grammar topics from /api/topics"
          test "$TOPICS_COUNT" -ge 16
          curl -fsS http://localhost:8080/api/stats >/dev/null
          curl -fsS http://localhost:8080/api/music-lessons >/dev/null
          curl -fsS http://localhost:8080/api/vocabulary >/dev/null
          curl -fsS http://localhost:8080/api/leaderboard >/dev/null
          echo "✅ All E2E API smoke checks passed!"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push Docker Images to GHCR (Continuous Delivery)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMG=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "frontend" | head -n 1)
          BACKEND_IMG=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "backend" | head -n 1)
          docker tag "$FRONTEND_IMG" "ghcr.io/$OWNER_LC/linguatype-frontend:latest"
          docker tag "$FRONTEND_IMG" "ghcr.io/$OWNER_LC/linguatype-frontend:${{ github.sha }}"
          docker tag "$BACKEND_IMG" "ghcr.io/$OWNER_LC/linguatype-backend:latest"
          docker tag "$BACKEND_IMG" "ghcr.io/$OWNER_LC/linguatype-backend:${{ github.sha }}"
          docker push "ghcr.io/$OWNER_LC/linguatype-frontend:latest"
          docker push "ghcr.io/$OWNER_LC/linguatype-frontend:${{ github.sha }}"
          docker push "ghcr.io/$OWNER_LC/linguatype-backend:latest"
          docker push "ghcr.io/$OWNER_LC/linguatype-backend:${{ github.sha }}"

      - name: Tear down Docker Compose Stack
        if: always()
        run: docker compose down -v
